name: C2-QA1 Exact-Build HTTPS Verification
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      QA_BASE: https://rawcdn.githack.com/amirkaha-collab/profit-mix-optimizer49/7eeb87c60b41946e356bc8f269bef092ac3bd7c3
      QA_URL: https://rawcdn.githack.com/amirkaha-collab/profit-mix-optimizer49/7eeb87c60b41946e356bc8f269bef092ac3bd7c3/qopt/c2a/ui/index.html
    steps:
      - name: Verify served byte identity and MIME
        shell: bash
        run: |
          node <<'NODE'
          const crypto=require('crypto');
          (async()=>{
          const expected=[{"path":"F8_CORE/qualifying/linear-program.js","sha":"e8c632bad14a4a479c00f10d3f1d23969eb5c1df"},{"path":"F8_CORE/src/continuation.js","sha":"03a12c87d581a7e744cb3fa090b9c4968862d3c3"},{"path":"F8_CORE/src/ledgers.js","sha":"d400856e5ee0c1e5dd9cb3c5673c5adf36675d0e"},{"path":"F8_CORE/src/schema.js","sha":"613cef65144b7d78c4ba3c009ac7073168d97888"},{"path":"l1/f8-l1-readiness.js","sha":"1ece8d66c13e97d7b69455271c719ffe9dbe2771"},{"path":"l2/f8-verified-expert-inputs.js","sha":"05c55678ffe43c0371effb9eb49a7c87849914b5"},{"path":"l2/f8-verified-rule-adapters.js","sha":"87ddf7e984796656c83ce6f6a83d2384b4cc82f4"},{"path":"l2/f8-verified-runtime-envelope.js","sha":"12f1a08b3c90a3285ea7795495154362a4b10532"},{"path":"methodology/integration/strategy-compiler.js","sha":"5ead00ef5ac6028616d15accc96e4a4e0b775612"},{"path":"methodology/m1/valuation.js","sha":"48a285af4f4c0cd45a51c5cbfbf2c89540d25813"},{"path":"methodology/m10/joint-global-allocator.js","sha":"d574ca960e8de31bb32ea86cdeb2c65196f72e9f"},{"path":"methodology/m3/residual-allocator.js","sha":"95e7dc1a2a57970ea7a79b0637ab39b6d9b455fb"},{"path":"methodology/m4/contingent-policy.js","sha":"8fb7531d937d077fe4987bab481f012062332328"},{"path":"methodology/m5/qualifying-replay.js","sha":"db36660fd3bc9d3142397c5b6bbecb79b00bda38"},{"path":"methodology/m6/service-source.js","sha":"b5060ac76cb42cff8c89bb2ca975af9fbfad6cd7"},{"path":"methodology/m7/contract-options.js","sha":"a6a63e9633aab96abe05cc33b6977affbdc6ad73"},{"path":"methodology/m8/contingent-receipts.js","sha":"b4ec64f916f8eeb43ae9fa1aa5e05d799d83aa61"},{"path":"methodology/m8/native-annuitization-frontier.js","sha":"6db2d8905b9686d4cf3b40c85a03b3c6ea3e4e46"},{"path":"methodology/m8/native-annuitization-point.js","sha":"5e5e5daa43c893831d1694d5d05d995a1f027cc8"},{"path":"methodology/m8/receipt-pipeline.js","sha":"836f84ffea78b3d33bd8793713a1b7dfc8811f70"},{"path":"methodology/m9/joint-mortality.js","sha":"8a3bd5609e441e9010306d65c76416bad1fd3d5d"},{"path":"methodology/shared/event-ordering-contract.js","sha":"f5d7f6be79904a5955b515335f63739a170831cc"},{"path":"methodology/shared/numerical-contract.js","sha":"b96322f11d8c346d973ab2a62f8cc97e77999911"},{"path":"qopt/c2a/c2a-parent-journey.js","sha":"4b279dc72d3c393f2064ed18cb5b00c82d420b33"},{"path":"qopt/c2a/ui/c2a.css","sha":"cf680902e97ce100abe669529f2f5d268241eff2"},{"path":"qopt/c2a/ui/c2a.js","sha":"73cecfc76b8b53bab8024b2080df25e2f9fe2e24"},{"path":"qopt/c2a/ui/index.html","sha":"ac7edd0955a3ad2651a3146de7d4c6c51fbd2979"},{"path":"qopt/c2b/c2b-baseline.js","sha":"9a22efcf52a1345e464e70f0c0e8645df02815a9"},{"path":"qopt/c2b/c2b-capital.js","sha":"156980a1bb602f59bb26525b9276d8fc8b0bafe0"},{"path":"qopt/c2b/c2b-contracts.js","sha":"d3eec80fa53e94387b347be412a51606407bcfb4"},{"path":"qopt/c2b/c2b-controller.js","sha":"19d1fbeaeef9b8c549dcc33e90896804e9d2a8ed"},{"path":"qopt/c2b/c2b-economic-primitives.js","sha":"044133790f746cac4367a6353cfefff6b7329228"},{"path":"qopt/c2b/c2b-income.js","sha":"034e99550d0c1fd6296f853ee7baa8a3d59ed892"},{"path":"qopt/c2b/ui/c2b-route-ui.js","sha":"ec48d7791bb070e19364cfa27b10a8e3a90d6ec8"},{"path":"qopt/c2b/ui/c2b.css","sha":"b6ec6b1647773e54e11c94a3ab4ca3edb9efb0c9"},{"path":"qopt/candidate1/candidate1-presentation.js","sha":"9bba1619d2d8b65cea1be7a302b1c03b0320eb5e"},{"path":"qopt/candidate1/ui/candidate1.css","sha":"04724413106528fb87867cfc77e5f96783066266"},{"path":"qopt/candidate1/ui/candidate1.js","sha":"7e72878ac99a56eb79ba443ed25ae884f67a4821"},{"path":"qopt/candidate1/ui/index.html","sha":"6e076061ce2822caa98f0e9c52e5980d40345741"},{"path":"qopt/candidate1/ui/node-crypto-browser-shim.js","sha":"dff0ec2573d117a66bd483ed48a0c7c7c2973c2c"},{"path":"qopt/q1b/q1b-contractual-equality.js","sha":"4919d184e6fdb3f50af0553fdda7dae82d0ec3a1"},{"path":"qopt/q1b/q1b-fixed-selected-plan-replay.js","sha":"6a54573dd8ea2f531ebb754858ce296d496285a8"},{"path":"qopt/q1c/q1c-product-integration.js","sha":"8963f3a5c501b7d8982d24050ad94924e98f5386"},{"path":"qopt/q1d/q1d-assumption-pack.js","sha":"de85e7d12491160cfcfd796244742187289bdc23"},{"path":"qopt/q1d/q1d-canonical-input-bridge.js","sha":"b15fbf6d9b86958acbf8532e1c09860d1dc7d846"},{"path":"qopt/q1d/q1d-product-integration.js","sha":"56a8a2945a0d4711b35cab4835b96cac4e0f4f52"},{"path":"u1/f8-binding.js","sha":"6486f9943b0f3961072941e4f5ab437d8ae87283"},{"path":"u1/f8-stable-hash.js","sha":"35ba1f437077b395529a42c254be2e9f765052ad"},{"path":"u1/f8-u1d-presentation.js","sha":"f6a0fa6b05ae8d43dc16834f250d9fbdce4447c2"}];
          const base=process.env.QA_BASE;
          function gitBlobSha(buf){const h=crypto.createHash('sha1');h.update(Buffer.from('blob '+buf.length+'\0'));h.update(buf);return h.digest('hex')}
          async function fetchRetry(url){
            let last;
            for(let i=0;i<12;i++){
              try{const r=await fetch(url,{cache:'no-store'});if(r.ok)return r;last=new Error('HTTP '+r.status+' '+url)}catch(e){last=e}
              await new Promise(r=>setTimeout(r,10000));
            }
            throw last;
          }
          const encodings=new Set();
          for(const item of expected){
            const r=await fetchRetry(base+'/'+item.path);
            const ab=await r.arrayBuffer(),buf=Buffer.from(ab);
            const got=gitBlobSha(buf);
            if(got!==item.sha)throw new Error('BYTE_IDENTITY_FAIL '+item.path+' expected '+item.sha+' got '+got);
            const ct=(r.headers.get('content-type')||'').toLowerCase();
            if(item.path.endsWith('.js')&&!/(javascript|ecmascript)/.test(ct))throw new Error('MIME_JS_FAIL '+item.path+' '+ct);
            if(item.path.endsWith('.css')&&!ct.includes('text/css'))throw new Error('MIME_CSS_FAIL '+item.path+' '+ct);
            if(item.path.endsWith('.html')&&!ct.includes('text/html'))throw new Error('MIME_HTML_FAIL '+item.path+' '+ct);
            const ce=r.headers.get('content-encoding'); if(ce)encodings.add(ce);
          }
          console.log(JSON.stringify({servedFiles:expected.length,byteIdentity:'PASS',mime:'PASS',contentEncodings:[...encodings]}));
          })().catch(e=>{console.error(e.stack||e);process.exit(1)});
          NODE
      - name: Install Playwright Chromium
        shell: bash
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0 >/dev/null
          npx playwright install chromium --with-deps >/dev/null
      - name: Browser smoke
        shell: bash
        run: |
          node <<'NODE'
          const {chromium}=require('playwright');
          const assert=(v,m)=>{if(!v)throw new Error('ASSERT '+m)};
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const page=await browser.newPage({viewport:{width:1280,height:900}});
            const consoleErrors=[],pageErrors=[],requestFailures=[],httpFailures=[];
            page.on('console',m=>{if(m.type()==='error')consoleErrors.push(m.text())});
            page.on('pageerror',e=>pageErrors.push(String(e.stack||e)));
            page.on('requestfailed',r=>requestFailures.push({url:r.url(),failure:r.failure()?.errorText||'failed'}));
            page.on('response',r=>{if(r.status()>=400)httpFailures.push({url:r.url(),status:r.status()})});
            const url=process.env.QA_URL;
            async function fresh(){
              await page.goto(url,{waitUntil:'networkidle',timeout:120000});
              await page.waitForFunction(()=>window.C2AQA&&window.C2AQA.getState);
            }
            async function goals(){
              await page.waitForSelector('#goalScreen.active');
              assert(await page.locator('.goal-card').count()===3,'three goals');
              const s=await page.evaluate(()=>window.C2AQA.getState());
              assert(s.selectedGoal==='NONE'&&s.activeRoute==='NONE','fresh NONE state');
              assert(await page.locator('#routeScreen.active').count()===0,'route not active');
              assert(await page.locator('.route-loading,.route-error,.c2b-results.active').count()===0,'no loader/error/result before choice');
            }
            async function select(goal){
              await page.locator('.goal-card[data-goal="'+goal+'"]').click();
              await page.waitForSelector('#routeScreen.active');
              await page.waitForFunction(g=>window.C2AQA.getState().activeRoute===g,goal);
            }
            async function back(){
              await page.locator('#backRoute').click();
              await page.waitForSelector('#goalScreen.active');
              const s=await page.evaluate(()=>window.C2AQA.getState());
              assert(s.activeRoute==='NONE','back returns NONE');
            }
            await fresh();
            await goals();
            console.log('SMOKE fresh-start PASS');

            await select('CAPITAL');
            await page.waitForSelector('.c2b-native-badge');
            let st=await page.evaluate(()=>window.C2AQA.getState());
            assert(st.routeFrameCount===0,'Capital no iframe');
            let q=await page.evaluate(()=>window.__C2B_ROUTE_QA);
            assert(q&&q.route==='CAPITAL'&&q.hasLegacyIframe===false,'Capital native C2-B');
            await page.locator('#c2bCalculate').click();
            await page.waitForSelector('#c2bResults.active');
            q=await page.evaluate(()=>window.__C2B_ROUTE_QA);
            assert(q.optimizerCalls===1&&q.planId,'Capital calculate');
            const capitalPlan=q.planId,calls=q.optimizerCalls;
            await page.locator('[data-baseline="MANAGED_INVESTMENT_PORTFOLIO"]').click();
            await page.waitForFunction(()=>window.__C2B_ROUTE_QA?.baselineType==='MANAGED_INVESTMENT_PORTFOLIO');
            q=await page.evaluate(()=>window.__C2B_ROUTE_QA);
            assert(q.optimizerCalls===calls&&q.planId===capitalPlan,'Capital baseline isolated');
            console.log('SMOKE Capital PASS');
            await back();

            await select('INCOME');
            await page.waitForSelector('.c2b-native-badge');
            st=await page.evaluate(()=>window.C2AQA.getState());
            assert(st.routeFrameCount===0,'Income no iframe');
            q=await page.evaluate(()=>window.__C2B_ROUTE_QA);
            assert(q&&q.route==='INCOME'&&q.hasLegacyIframe===false,'Income native C2-B');
            await page.locator('#c2bCalculate').click();
            await page.waitForSelector('#c2bResults.active');
            q=await page.evaluate(()=>window.__C2B_ROUTE_QA);
            assert(q.optimizerCalls===1&&q.planId,'Income calculate');
            const incomePlan=q.planId,incomeCalls=q.optimizerCalls;
            await page.locator('[data-baseline="MANAGED_INVESTMENT_PORTFOLIO"]').click();
            await page.waitForFunction(()=>window.__C2B_ROUTE_QA?.baselineType==='MANAGED_INVESTMENT_PORTFOLIO');
            q=await page.evaluate(()=>window.__C2B_ROUTE_QA);
            assert(q.optimizerCalls===incomeCalls&&q.planId===incomePlan,'Income baseline isolated');
            console.log('SMOKE Income PASS');
            await back();

            await select('INHERITANCE');
            await page.waitForSelector('iframe.route-frame[data-route-ready="true"]',{timeout:120000});
            st=await page.evaluate(()=>window.C2AQA.getState());
            assert(st.routeFrameCount===1,'Inheritance one Candidate iframe');
            let frame=page.frames().find(f=>f!==page.mainFrame());
            assert(frame,'Inheritance frame exists');
            await frame.waitForSelector('#intakeScreen.active');
            assert(await frame.locator('#memberAge').count()===1,'q1D intake accessible');
            const cq=await frame.evaluate(()=>({qa:!!window.CANDIDATE1QA,state:window.CANDIDATE1QA?.getState?.(),errors:window.CANDIDATE1QA?.errors?.()}));
            assert(cq.qa&&cq.state?.status==='EMPTY','Candidate 1 QA intake');
            assert((cq.errors||[]).length===0,'Candidate browser errors zero');
            assert(await page.locator('.route-error').count()===0,'no inheritance fallback error');
            console.log('SMOKE Inheritance PASS');

            // Exact cross-route sequence: Inheritance -> Back -> Capital -> Back -> Income -> Back -> Inheritance
            await back();
            await select('CAPITAL'); await page.waitForSelector('.c2b-native-badge');
            assert(await page.locator('#c2bResults.active').count()===0,'Capital no stale result flash state');
            assert((await page.evaluate(()=>window.C2AQA.getState())).routeFrameCount===0,'Capital clean owner');
            await back();
            await select('INCOME'); await page.waitForSelector('.c2b-native-badge');
            assert(await page.locator('#c2bResults.active').count()===0,'Income no stale result flash state');
            assert((await page.evaluate(()=>window.C2AQA.getState())).routeFrameCount===0,'Income clean owner');
            await back();
            await select('INHERITANCE'); await page.waitForSelector('iframe.route-frame[data-route-ready="true"]',{timeout:120000});
            frame=page.frames().find(f=>f!==page.mainFrame());
            await frame.waitForSelector('#intakeScreen.active');
            assert(await page.locator('.c2b-route').count()===0,'no old C2-B writer in inheritance');
            assert(await page.locator('.route-error').count()===0,'no route error');
            console.log('SMOKE cross-route PASS');

            // Mobile
            await page.setViewportSize({width:390,height:844});
            await fresh(); await goals();
            const overflow=await page.evaluate(()=>document.documentElement.scrollWidth-window.innerWidth);
            assert(overflow<=1,'mobile horizontal overflow '+overflow);
            const visible=await page.locator('.goal-card').evaluateAll(xs=>xs.every(x=>{const r=x.getBoundingClientRect();return r.width>0&&r.height>0}));
            assert(visible,'mobile three goals visible');
            await select('CAPITAL'); await page.waitForSelector('.c2b-native-badge');
            assert(await page.locator('#backRoute').isVisible(),'mobile navigation usable');
            await back();
            console.log('SMOKE mobile PASS');

            await page.waitForTimeout(500);
            const c2aErrors=await page.evaluate(()=>window.C2AQA?.errors?.()||[]);
            if(c2aErrors.length)consoleErrors.push(...c2aErrors.map(x=>'C2A:'+x));
            const evidence={consoleErrors,pageErrors,requestFailures,httpFailures};
            console.log('NETWORK_EVIDENCE '+JSON.stringify(evidence));
            assert(consoleErrors.length===0,'console errors '+JSON.stringify(consoleErrors));
            assert(pageErrors.length===0,'page errors '+JSON.stringify(pageErrors));
            assert(requestFailures.length===0,'request failures '+JSON.stringify(requestFailures));
            assert(httpFailures.length===0,'HTTP failures '+JSON.stringify(httpFailures));
            console.log('C2_QA1_BROWSER_RESULT '+JSON.stringify({freshStart:'PASS',capital:'PASS',income:'PASS',inheritance:'PASS',crossRoute:'PASS',mobile:'PASS',browserConsoleErrors:0,requiredModuleLoadFailures:0,requiredNetworkFailures:0}));
            await browser.close();
          })().catch(e=>{console.error(e.stack||e);process.exit(1)});
          NODE
